# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

# 常用任务显示在默认列表；专项任务可通过 task tasks 查看。
tasks:
  default:
    summary: Show available tasks
    cmds:
      - task --list
    silent: true

  tasks:
    desc: 查看全部任务（含专项验证）
    cmds:
      - task --list-all
    silent: true

  init:
    desc: 生成本地开发配置（保留已有配置）
    preconditions:
      - sh: node --version
        msg: '需要 Node.js；安装后重新运行 task init。'
    cmds:
      - node scripts/dev-setup.mjs init {{.CLI_ARGS}}

  doctor:
    desc: 检查开发工具、配置和数据库连接
    preconditions:
      - sh: node --version
        msg: '需要 Node.js；安装后重新运行 task doctor。'
    cmds:
      - node scripts/dev-setup.mjs doctor {{.CLI_ARGS}}

  dev:setup:test:
    summary: Run development setup bootstrap command tests
    cmds:
      - node --test scripts/dev-setup.test.mjs

  db:migrate:
    desc: 执行数据库结构和初始数据迁移
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:schema:
    summary: Apply schema migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind schema

  db:migrate:seed:
    summary: Apply seed migrations only
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind seed

  api:
    summary: Start the Go API
    dir: server
    cmds:
      - go run ./cmd/api

  web:
    summary: Start the React development server
    dir: web
    cmds:
      - pnpm run dev

  host:collector:
    summary: Start the Linux host resource collector; pass flags through CLI_ARGS
    dir: server
    cmds:
      - go run ./cmd/host-collector {{.CLI_ARGS}}

  host:build:
    summary: Build the Linux host resource collector
    dir: server
    cmds:
      - go build -trimpath -o ../bin/base-go-host-collector ./cmd/host-collector

  host:smoke:
    summary: Verify real Linux host samples, Unix socket and collector restart
    deps:
      - host:build
    cmds:
      - python3 scripts/check-host-collector.py {{.CLI_ARGS}}

  dev:
    desc: 执行迁移并启动 API 和 Web
    deps:
      - db:migrate
    cmds:
      - task --parallel api web

  backend:test:
    summary: Run backend unit tests
    dir: server
    cmds:
      - go test ./...

  backend:swagger:
    summary: Regenerate API documentation from handler contracts
    dir: server
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.8.12 init -g cmd/api/main.go --parseInternal --output docs

  backend:windows:
    summary: Cross-build Windows amd64 API, migrations and monitoring tests (PostgreSQL, no CGO)
    dir: server
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -o ../bin/base-go-api-windows-amd64.exe ./cmd/api
      - go build -trimpath -o ../bin/base-go-migrate-windows-amd64.exe ./cmd/migrate
      - go test -c -o ../.task/windows-monitoring.test.exe ./internal/monitoring
      - go vet ./cmd/api ./internal/monitoring

  monitoring:smoke:windows:
    summary: Run read-only native monitoring verification on Windows (or WSL with Windows interop)
    deps:
      - backend:windows
    cmds:
      - '"{{.ROOT_DIR}}/.task/windows-monitoring.test.exe" -test.timeout 30s -test.v -test.run "TestWindows|TestInterfaceAddressesKeepHostIPAndPrefix|TestNetworkAddressesThroughHTTP|TestDisabledMonitoringHTTPAndSampling" -windows-smoke'

  backend:notifications:
    summary: Run announcement, notification, SSE and capacity integration contracts
    dir: server
    cmds:
      - go test -tags=integration ./integration -run 'Notification|Announcement' -count=1

  backend:integration:
    summary: Run backend PostgreSQL integration tests
    dir: server
    cmds:
      - go test -tags=integration ./integration -run 'Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Monitor' -count=1

  db:integration:postgres:
    summary: Run the PostgreSQL database integration contract
    dir: server
    cmds:
      - go test -tags=integration ./integration -run 'Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Monitor' -count=1

  db:check:
    summary: Run backend checks and PostgreSQL integration contract
    deps:
      - backend:check
      - db:integration:postgres

  backend:check:
    summary: Run backend tests and static checks
    dir: server
    cmds:
      - go test ./...
      - go vet ./...

  frontend:install:
    desc: 安装前端依赖
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  frontend:lint:
    summary: Run frontend lint
    dir: web
    cmds:
      - pnpm run lint

  frontend:typecheck:
    summary: Run frontend TypeScript checks
    dir: web
    cmds:
      - pnpm run typecheck

  frontend:test:
    summary: Run frontend unit tests
    dir: web
    cmds:
      - pnpm run test

  frontend:build:
    summary: Type-check and build the frontend
    dir: web
    cmds:
      - pnpm run build

  check:
    desc: 运行后端和前端检查
    deps:
      - dev:setup:test
      - backend:check
      - frontend:lint
      - frontend:typecheck
      - frontend:test
      - frontend:build

  build:
    desc: 构建内嵌 Web 的发布程序
    deps:
      - frontend:build
    dir: server
    vars:
      GOEXE:
        sh: go env GOEXE
    cmds:
      - node ../scripts/prepare-webui.mjs
      - go build -tags=embedweb -trimpath -o ../bin/base-go-api{{.GOEXE}} ./cmd/api
      - go build -trimpath -o ../bin/base-go-migrate{{.GOEXE}} ./cmd/migrate
      - go build -trimpath -o ../bin/base-go-host-collector{{.GOEXE}} ./cmd/host-collector

  build:check:
    summary: Build the release and verify tests and vet with embedded frontend assets
    deps:
      - build
    dir: server
    cmds:
      - go test -tags=embedweb ./...
      - go vet -tags=embedweb ./...

  test:
    summary: Run the default test suite
    deps:
      - backend:test
